services:
  # Interface Next.js — affichage, upload, déclenchement des workflows
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://mistra:${DB_PASSWORD}@db:5432/mistra
      - MASTRA_URL=http://orchestrator:4111
      - FICHIERS_BASE_URL=http://web:3000
      - UPLOADS_DIR=/app/uploads
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      orchestrator:
        condition: service_started
    restart: unless-stopped

  # Orchestration Mastra — workflows intake + recontrole, serveur MCP en sous-processus
  # Port 4111 volontairement NON publié : l'API Mastra n'a pas d'authentification,
  # seul le service web doit pouvoir l'atteindre (réseau interne compose)
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    environment:
      - DATABASE_URL=postgresql://mistra:${DB_PASSWORD}@db:5432/mistra
      - OCR_ENDPOINT=http://ocr:3000
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started
    restart: unless-stopped

  # Postgres — tables métier (public) + état des workflows Mastra (schéma mastra)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mistra
      POSTGRES_USER: mistra
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mistra_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mistra"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # OCR — Gotenberg
  ocr:
    image: gotenberg/gotenberg:8
    environment:
      - CHROMIUM_DISABLE_ROUTES=1
    ports:
      - "3020:3000"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
